<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donglyn — Cek Email Kamu</title>
<link rel="icon" type="image/png" href="/asset/favicon.png">
<link rel="stylesheet" href="/static/css/output.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;background:#141414;color:#fff}
.bg-hero{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;background:url('/asset/bg-login & register.png') center/cover no-repeat}
.bg-hero::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55)}
.container{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px 60px}
.verify-box{background:rgba(0,0,0,0.75);border-radius:4px;padding:48px 68px 60px;width:100%;max-width:450px;text-align:center}
@media(max-width:500px){.verify-box{padding:40px 28px;max-width:100%}}
.verify-icon{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px;background:rgba(234,179,8,0.15);color:#eab308;border:2px solid rgba(234,179,8,0.3)}
.verify-box h1{font-size:22px;font-weight:700;margin-bottom:8px}
.verify-box p{color:#8c8c8c;font-size:15px;line-height:1.6;margin-bottom:8px}
.email-highlight{color:#fff;font-weight:600;margin-bottom:4px}
.text-small{font-size:13px;margin-top:8px}
.btn-row{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.btn-resend{background:transparent;border:1px solid #333;color:#8c8c8c;font-size:14px;font-weight:600;padding:12px;border-radius:2px;cursor:pointer;transition:all .2s}
.btn-resend:hover:not(.disabled){border-color:#fff;color:#fff}
.btn-resend.disabled{opacity:.5;cursor:not-allowed}
.btn-back{background:#e50914;border:none;color:#fff;font-size:14px;font-weight:700;padding:12px;border-radius:2px;cursor:pointer;text-decoration:none;transition:background .2s}
.btn-back:hover{background:#f40612}
.sent-ok{color:#22c55e;font-size:13px;margin-top:12px;display:none}
.nav-logo{height:42px;width:auto}
</style>
</head>
<body>
<div class="bg-hero"></div>
<div class="container">
  <nav class="flex items-center px-8 py-4">
    <a href="/"><img src="/asset/logo.png" alt="Donglyn" title="Donglyn" class="nav-logo" onerror="this.style.display='none'"></a>
  </nav>
  <div class="main">
    <div class="verify-box">
      <div class="verify-icon"></div>
      <h1>Cek Email Kamu</h1>
      <p>Kami sudah mengirim link verifikasi ke</p>
      <p class="email-highlight">{{ email }}</p>
      <p class="text-small">Klik link di email tersebut untuk mengaktifkan akun kamu.</p>
      <div class="btn-row">
        <button class="btn-resend" id="btnResend" onclick="resend()">Kirim Ulang Email</button>
        <a href="/login" class="btn-back">Kembali ke Login</a>
      </div>
      <p class="sent-ok" id="sentOk">Email verifikasi baru sudah dikirim!</p>
    </div>
  </div>
</div>
<script>
let cooldown = null;
async function resend() {
  const btn = document.getElementById('btnResend');
  const ok = document.getElementById('sentOk');
  btn.disabled = true; btn.classList.add('disabled'); btn.textContent = 'Mengirim...'; ok.style.display = 'none';
  try {
    const res = await fetch('/api/auth/resend-verification', {
      method: 'POST', headers: {'Content-Type':'application/json'}, credentials: 'include',
      body: JSON.stringify({email: '{{ email }}'})
    });
    const j = await res.json();
    if (j.status === 'success') { ok.style.display = 'block'; startCooldown(); }
    else { btn.textContent = j.message; btn.classList.remove('disabled'); btn.disabled = false; }
  } catch { btn.textContent = 'Gagal mengirim'; btn.classList.remove('disabled'); btn.disabled = false; }
}
function startCooldown() {
  const btn = document.getElementById('btnResend');
  let sec = 60;
  btn.textContent = `Kirim ulang (${sec}s)`;
  clearInterval(cooldown);
  cooldown = setInterval(() => { sec--; if(sec<=0){clearInterval(cooldown);btn.textContent='Kirim Ulang Email';btn.classList.remove('disabled');btn.disabled=false;} else {btn.textContent=`Kirim ulang (${sec}s)`;} }, 1000);
}
</script>
<script>document.addEventListener("DOMContentLoaded", function(){ lucide.createIcons(); });</script></body>
</html>
