<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bookmark — VEXORA</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="/static/css/output.css"/>
  <style>
    #mobileMenu{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease;opacity:0;padding:0 1rem}
    #mobileMenu.open{max-height:400px;opacity:1;padding:0.75rem 1rem}
    /* Nav sliding indicator */
    .nav-wrap{position:relative}
    .nav-indicator{position:absolute;bottom:-2px;height:2px;background:#e50914;border-radius:2px;transition:left .35s cubic-bezier(.4,0,.2,1),width .35s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px rgba(229,9,20,.7),0 0 20px rgba(229,9,20,.3);pointer-events:none;opacity:0}
    .nav-indicator.active{opacity:1}
  </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen font-['Inter',sans-serif]">
  <nav class="fixed top-0 w-full z-50 bg-[#0a0a0a]/90 backdrop-blur-xl border-b border-white/[0.06]">
    <div class="max-w-[1600px] mx-auto px-3 md:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center">
          <img src="/asset/logo.png" alt="VEXORA" title="VEXORA" class="h-8 md:h-9 lg:h-10 w-auto object-contain max-h-[40px]" onerror="this.style.display='none'"/>
        </a>
        <div class="hidden lg:flex items-center gap-6 text-[13px] font-semibold nav-wrap">
          <a href="/" data-nav="beranda" class="text-white/70 hover:text-white transition cursor-pointer pb-1 border-b-2 border-transparent flex items-center gap-2"><i class="fa-solid fa-house text-xs"></i> Beranda</a>
          <a href="/genre" data-nav="genre" class="text-white/70 hover:text-white transition cursor-pointer pb-1 border-b-2 border-transparent flex items-center gap-2"><i class="fa-solid fa-layer-group text-xs"></i> Genre</a>
          <a href="/schedule" data-nav="schedule" class="text-white/70 hover:text-white transition cursor-pointer pb-1 border-b-2 border-transparent flex items-center gap-2"><i class="fa-solid fa-calendar text-xs"></i> Jadwal</a>
          <a href="/terbaru" data-nav="terbaru" class="text-white/70 hover:text-white transition cursor-pointer pb-1 border-b-2 border-transparent flex items-center gap-2"><i class="fa-solid fa-bolt text-xs"></i> Terbaru</a>
          <a href="/bookmark" data-nav="bookmark" class="text-white font-bold border-b-2 border-transparent cursor-pointer pb-1 flex items-center gap-2"><i class="fa-solid fa-bookmark text-xs"></i> Bookmark</a>
          <a href="/riwayat" data-nav="riwayat" class="text-white/70 hover:text-white transition cursor-pointer pb-1 border-b-2 border-transparent flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-xs"></i> Riwayat</a>
          <span class="nav-indicator"></span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="authNav" class="flex items-center gap-2">
          <a href="/login" id="btnLogin" class="hidden md:inline-flex bg-[#e50914] hover:bg-[#b20710] text-white px-4 py-1.5 rounded-md text-xs font-extrabold transition">Masuk</a>
          <a href="/register" id="btnRegister" class="hidden md:inline-flex bg-white/[0.06] border border-white/10 hover:bg-white/10 text-white px-4 py-1.5 rounded-md text-xs font-bold transition">Daftar</a>
        </div>
        <div id="userMenu" class="hidden items-center cursor-pointer" onclick="document.getElementById('userDropdown').classList.toggle('hidden')">
          <img id="navAvatar" src="https://i.pravatar.cc/100?u=netflix" alt="Foto profil" title="Foto profil" class="w-8 h-8 rounded-full object-cover border border-white/15"/>
          <div id="userDropdown" class="hidden absolute right-0 top-16 w-44 bg-[#161616] border border-white/10 rounded-lg shadow-2xl z-50 overflow-hidden">
            <a href="/profile" class="block px-4 py-2.5 text-xs font-bold hover:bg-white/[0.06] transition"><i class="fa-solid fa-user mr-2 text-white/40"></i>Profil</a>
            <button onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/')" class="w-full text-left px-4 py-2.5 text-xs font-bold text-red-400 hover:bg-white/[0.06] transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>Keluar</button>
          </div>
        </div>
        <button id="mobileMenuBtn" class="lg:hidden w-8 h-8 flex items-center justify-center border border-white/10 rounded-md bg-white/5 hover:bg-white/10 transition" onclick="document.getElementById('mobileMenu').classList.toggle('open')" aria-label="Buka menu"><i class="fa-solid fa-bars text-sm text-white/60"></i></button>
      </div>
    </div>
    <div id="mobileMenu" class="lg:hidden bg-[#0e0e0e] border-t border-white/[0.06]">
      <a href="/" class="flex py-2.5 text-sm font-bold text-white/60 hover:text-white items-center gap-3 rounded-lg hover:bg-white/5 px-3 transition"><i class="fa-solid fa-house w-5 text-center"></i> Beranda</a>
      <a href="/genre" class="flex py-2.5 text-sm font-bold text-white/60 hover:text-white items-center gap-3 rounded-lg hover:bg-white/5 px-3 transition"><i class="fa-solid fa-layer-group w-5 text-center"></i> Genre</a>
      <a href="/schedule" class="flex py-2.5 text-sm font-bold text-white/60 hover:text-white items-center gap-3 rounded-lg hover:bg-white/5 px-3 transition"><i class="fa-solid fa-calendar w-5 text-center"></i> Jadwal</a>
      <a href="/bookmark" class="flex py-2.5 text-sm font-bold text-white items-center gap-3 rounded-lg bg-white/5 px-3"><i class="fa-solid fa-bookmark w-5 text-center"></i> Bookmark</a>
      <a href="/riwayat" class="flex py-2.5 text-sm font-bold text-white/60 hover:text-white items-center gap-3 rounded-lg hover:bg-white/5 px-3 transition"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> Riwayat</a>
      <div class="border-t border-white/[0.06] mt-2 pt-2 space-y-1">
        <a href="/login" class="flex py-2 text-sm font-bold text-white items-center gap-2"><i class="fa-solid fa-right-to-bracket w-5"></i> Masuk</a>
        <a href="/register" class="flex py-2 text-sm font-bold text-white/70 items-center gap-2"><i class="fa-solid fa-user-plus w-5"></i> Daftar</a>
      </div>
    </div>
  </nav>

  <section class="pt-20 md:pt-24 pb-6 bg-gradient-to-b from-[#0a0a0a] to-[#0a0a0a]">
    <div class="max-w-[1600px] mx-auto px-4 md:px-10">
      <div class="flex items-center gap-2 text-[#e50914] text-xs font-black tracking-[0.18em]"><i class="fa-solid fa-bookmark"></i> BOOKMARK</div>
      <h1 class="font-black text-[28px] md:text-[36px] leading-none mt-2">Daftar Saya</h1>
      <p class="text-sm text-white/50 mt-2">Donghua yang sudah kamu simpan.</p>
    </div>
  </section>

  <section class="max-w-[1600px] mx-auto px-4 md:px-10 pb-10">
    <div id="bookmarkGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4"></div>
    <div id="emptyState" class="hidden text-center py-20">
      <i class="fa-regular fa-bookmark text-5xl text-white/15 mb-4"></i>
      <p class="text-sm font-bold text-white/40">Belum ada bookmark</p>
      <p class="text-xs text-white/25 mt-1">Klik ikon bookmark untuk menyimpan donghua favoritmu.</p>
      <a href="/" class="inline-flex items-center gap-2 mt-5 bg-[#e50914] hover:bg-[#b20710] text-white px-5 py-2 rounded-lg text-xs font-bold transition"><i class="fa-solid fa-house"></i> Ke Beranda</a>
    </div>
  </section>

<script src="/static/js/sync.js"></script>
<script>
async function loadBookmarks(){
  try{
    let r=await fetch('/api/auth/me',{credentials:'include'});let j=await r.json();
    if(!j.logged_in){location.href='/login';return;}
    document.getElementById('navAvatar').src=j.user.avatar||'https://i.pravatar.cc/100?u='+encodeURIComponent(j.user.username);
    document.getElementById('authNav').classList.add('hidden');
    document.getElementById('userMenu').classList.remove('hidden');
    document.getElementById('userMenu').classList.add('flex');
    let bm=await VX.getBookmarks();
    renderBookmarks(bm);
  }catch(e){console.error(e);}
}
function renderBookmarks(bm){
  let grid=document.getElementById('bookmarkGrid');
  grid.innerHTML='';
  if(!bm||bm.length===0){
    document.getElementById('emptyState').classList.remove('hidden');
    return;
  }
  document.getElementById('emptyState').classList.add('hidden');
  bm.forEach(item=>{
    let card=document.createElement('div');
    card.className='group relative bg-[#181818] hover:bg-[#232323] border border-white/5 hover:border-white/15 rounded-lg overflow-hidden transition hover:scale-[1.02]';
    let a=document.createElement('a');
    a.href=item.url||'#';
    a.className='block';
    a.innerHTML=`<div class="relative aspect-[2/3] overflow-hidden"><img loading="lazy" src="${item.thumbnail||item.poster||''}" alt="${item.title||''}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22 fill=%22%23232323%22><rect width=%22200%22 height=%22300%22/><text x=%22100%22 y=%22150%22 text-anchor=%22middle%22 fill=%22%23444%22 font-size=%2214%22>No Image</text></svg>'"/></div><div class="p-3"><p class="text-sm font-bold truncate">${item.title||'Untitled'}</p></div>`;
    card.appendChild(a);
    let btn=document.createElement('button');
    btn.className='absolute top-2 right-2 w-7 h-7 flex items-center justify-center rounded-full bg-black/70 text-white/80 hover:text-red-400 hover:bg-black/90 transition z-10';
    btn.title='Hapus dari bookmark';
    btn.innerHTML='<i class="fa-solid fa-xmark"></i>';
    btn.addEventListener('click', async (e)=>{ e.preventDefault(); e.stopPropagation(); await VX.removeBookmark(item.url); renderBookmarks(await VX.getBookmarks()); });
    card.appendChild(btn);
    grid.appendChild(card);
  });
}
document.addEventListener('DOMContentLoaded', loadBookmarks);
window.addEventListener('click',e=>{if(!e.target.closest('#userMenu')){let d=document.getElementById('userDropdown');if(d)d.classList.add('hidden');}});
function moveNavIndicator(el){
  let ind=document.querySelector('.nav-indicator'); if(!ind||!el) return;
  let wrap=el.parentElement; let wRect=wrap.getBoundingClientRect(); let eRect=el.getBoundingClientRect();
  ind.classList.add('active');
  ind.style.left=(eRect.left-wRect.left)+'px';
  ind.style.width=eRect.width+'px';
}
function setupNavIndicator(){
  let wrap=document.querySelector('.nav-wrap'); if(!wrap) return;
  let active=wrap.querySelector('a.text-white:not(.text-white\\/70)');
  if(active) moveNavIndicator(active);
  wrap.querySelectorAll('a[data-nav]').forEach(a=>{
    a.addEventListener('mouseenter',()=>moveNavIndicator(a));
    a.addEventListener('mouseleave',()=>{let cur=wrap.querySelector('a.text-white:not(.text-white\\/70)'); if(cur) moveNavIndicator(cur);});
  });
}
document.addEventListener('DOMContentLoaded', setupNavIndicator);
</script>
</body>
</html>
