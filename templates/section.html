<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Section — VEXORA</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="/static/css/output.css"/>
  <style>
    .section-card{position:relative;display:flex;flex-direction:column;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;transition:all 0.35s cubic-bezier(0.23,1,0.32,1)}
    .section-card:hover{transform:translateY(-6px) scale(1.02);border-color:rgba(229,9,20,0.35);box-shadow:0 12px 40px rgba(0,0,0,0.5),0 0 20px rgba(229,9,20,0.1)}
  </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen font-['Inter',sans-serif]">
  <nav class="fixed top-0 w-full z-50 bg-[#0a0a0a]/90 backdrop-blur-xl border-b border-white/[0.06]">
    <div class="max-w-[1600px] mx-auto px-3 md:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center">
          <img src="/asset/logo.png" alt="VEXORA" title="VEXORA" class="h-8 md:h-9 lg:h-10 w-auto object-contain max-h-[40px]" onerror="this.style.display='none'"/>
        </a>
        <button class="lg:hidden w-8 h-8 flex items-center justify-center border border-white/10 rounded-md bg-white/5 hover:bg-white/10 transition" onclick="document.getElementById('mobileMenu').classList.toggle('hidden')" aria-label="Buka menu"><i class="fa-solid fa-bars text-sm text-white/60"></i></button>
        <div class="hidden lg:flex items-center gap-6 text-[13px] font-semibold">
          <a href="/" class="text-white/50 hover:text-white transition flex items-center gap-2 py-1"><i class="fa-solid fa-house text-xs"></i> Beranda</a>
          <a href="/genre" class="text-white/50 hover:text-white transition flex items-center gap-2 py-1"><i class="fa-solid fa-layer-group text-xs"></i> Genre</a>
          <a href="/schedule" class="text-white/50 hover:text-white transition flex items-center gap-2 py-1"><i class="fa-solid fa-calendar text-xs"></i> Jadwal</a>
          <a href="/" class="text-white/50 hover:text-white transition flex items-center gap-2 py-1"><i class="fa-solid fa-bolt text-xs"></i> Terbaru</a>
          <a href="/bookmark" class="text-white/50 hover:text-white transition flex items-center gap-2 py-1"><i class="fa-solid fa-bookmark text-xs"></i> Bookmark</a>
          <a href="/riwayat" class="text-white/50 hover:text-white transition flex items-center gap-2 py-1"><i class="fa-solid fa-clock-rotate-left text-xs"></i> Riwayat</a>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="authNav" class="flex items-center gap-2">
          <a href="/login" id="btnLogin" class="hidden md:inline-flex bg-[#e50914] hover:bg-[#b20710] text-white px-4 py-1.5 rounded-md text-xs font-extrabold transition">Masuk</a>
          <a href="/register" id="btnRegister" class="hidden md:inline-flex bg-white/[0.06] border border-white/10 hover:bg-white/10 text-white px-4 py-1.5 rounded-md text-xs font-bold transition">Daftar</a>
        </div>
        <div id="userMenu" class="hidden items-center cursor-pointer" onclick="document.getElementById('userDropdown').classList.toggle('hidden')">
          <img id="navAvatar" src="https://i.pravatar.cc/100?u=netflix" alt="Foto profil" title="Foto profil" class="w-8 h-8 rounded-full object-cover border border-white/15"/>
          <div id="userDropdown" class="hidden absolute right-4 md:right-10 top-16 w-44 bg-[#161616] border border-white/10 rounded-lg shadow-2xl z-50 overflow-hidden">
            <a href="/profile" class="block px-4 py-2.5 text-xs font-bold hover:bg-white/[0.06] transition"><i class="fa-solid fa-user mr-2 text-white/40"></i>Profil</a>
            <button onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/')" class="w-full text-left px-4 py-2.5 text-xs font-bold text-red-400 hover:bg-white/[0.06] transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>Keluar</button>
          </div>
        </div>
      </div>
    </div>
    <div id="mobileMenu" class="hidden lg:hidden bg-[#0e0e0e] border-t border-white/[0.06] px-4 py-3 space-y-1">
      <a href="/" class="flex py-2.5 text-sm font-bold text-white/60 hover:text-white items-center gap-3 rounded-lg hover:bg-white/5 px-3 transition"><i class="fa-solid fa-house w-5 text-center"></i> Beranda</a>
      <a href="/genre" class="flex py-2.5 text-sm font-bold text-white/60 hover:text-white items-center gap-3 rounded-lg hover:bg-white/5 px-3 transition"><i class="fa-solid fa-layer-group w-5 text-center"></i> Genre</a>
      <a href="/schedule" class="flex py-2.5 text-sm font-bold text-white/60 hover:text-white items-center gap-3 rounded-lg hover:bg-white/5 px-3 transition"><i class="fa-solid fa-calendar w-5 text-center"></i> Jadwal</a>
    </div>
  </nav>

  <div id="loading" class="pt-28 text-center min-h-screen flex flex-col items-center justify-center">
    <div class="w-10 h-10 rounded-full border-2 border-white/10 border-t-[#e50914] animate-spin mx-auto"></div>
    <p class="text-xs font-bold tracking-[0.25em] text-white/40 mt-4 animate-pulse">MEMUAT...</p>
  </div>

  <section id="sectionContent" class="hidden pt-20 md:pt-24 pb-6 bg-gradient-to-b from-[#0a0a0a] to-[#0a0a0a]">
    <div class="max-w-[1600px] mx-auto px-4 md:px-10">
      <div class="flex items-center gap-2 text-[#e50914] text-xs font-black tracking-[0.18em]"><i class="fa-solid fa-film"></i> SECTION</div>
      <h1 id="sectionTitle" class="font-black text-[28px] md:text-[36px] leading-none mt-2"></h1>
      <p id="sectionCount" class="text-sm text-white/50 mt-2"></p>
    </div>
  </section>

  <section id="sectionGrid" class="hidden max-w-[1600px] mx-auto px-4 md:px-10 pb-10">
    <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4"></div>
    <div id="loadMoreWrap" class="hidden flex justify-center mt-6">
      <button id="loadMoreBtn" class="group bg-[#e50914] hover:bg-[#b20710] text-white px-5 py-2 rounded-lg text-xs font-black flex items-center gap-2 transition">
        <span>Next</span> <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-0.5 transition"></i>
      </button>
    </div>
  </section>

<script>
const sectionUrl = new URLSearchParams(window.location.search).get('url');
const sectionName = new URLSearchParams(window.location.search).get('name');

async function loadSection() {
  if (!sectionUrl) {
    document.getElementById('loading').innerHTML = '<p class="text-red-400 font-bold">URL tidak ditemukan.</p>';
    return;
  }

  document.getElementById('sectionTitle').textContent = sectionName || 'Section';

  try {
    const res = await fetch(`/api/load-more?url=${encodeURIComponent(sectionUrl)}`);
    const data = await res.json();

    if (data.status === 'success' && data.data && data.data.length) {
      document.getElementById('sectionCount').textContent = `${data.data.length} judul`;

      const grid = document.getElementById('animeGrid');
      data.data.forEach(anime => {
        const detailUrl = anime.url ? `/detail?url=${encodeURIComponent(anime.url)}` : '#';
        const card = document.createElement('a');
        card.href = detailUrl;
        card.className = 'section-card';
        card.innerHTML = `
          <div class="relative aspect-[2/3] overflow-hidden bg-[#1a1a1a]">
            <img src="${anime.poster || ''}" alt="${anime.title || ''}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.style.display='none'"/>
            ${anime.episode ? `<span class="absolute top-2 left-2 bg-[#e50914] text-white text-[10px] font-black px-2 py-0.5 rounded">${anime.episode}</span>` : ''}
            ${anime.type ? `<span class="absolute top-2 right-2 bg-black/60 backdrop-blur text-white text-[10px] font-bold px-2 py-0.5 rounded">${anime.type}</span>` : ''}
          </div>
          <div class="p-3">
            <p class="text-sm font-bold truncate group-hover:text-[#e50914] transition">${anime.title || 'Untitled'}</p>
            <div class="flex items-center gap-2 mt-1.5">
              ${anime.genre ? `<span class="text-[11px] text-white/40 truncate"><i class="fa-solid fa-layer-group mr-1 text-[9px]"></i>${anime.genre}</span>` : ''}
              ${anime.status ? `<span class="text-[11px] ml-auto font-bold ${anime.status.toLowerCase().includes('ongoing') ? 'text-[#e50914]' : 'text-emerald-400'}">${anime.status}</span>` : ''}
            </div>
          </div>`;
        grid.appendChild(card);
      });

      // Load more
      const nextUrl = data.next_url || data.more_url;
      if (nextUrl) {
        document.getElementById('loadMoreWrap').classList.remove('hidden');
        document.getElementById('loadMoreBtn').onclick = async function () {
          this.disabled = true;
          this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memuat...';
          try {
            const res2 = await fetch(`/api/load-more?url=${encodeURIComponent(nextUrl)}`);
            const data2 = await res2.json();
            if (data2.status === 'success' && data2.data && data2.data.length) {
              data2.data.forEach(anime => {
                const detailUrl = anime.url ? `/detail?url=${encodeURIComponent(anime.url)}` : '#';
                const card = document.createElement('a');
                card.href = detailUrl;
                card.className = 'section-card';
                card.innerHTML = `
                  <div class="relative aspect-[2/3] overflow-hidden bg-[#1a1a1a]">
                    <img src="${anime.poster || ''}" alt="${anime.title || ''}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.style.display='none'"/>
                    ${anime.episode ? `<span class="absolute top-2 left-2 bg-[#e50914] text-white text-[10px] font-black px-2 py-0.5 rounded">${anime.episode}</span>` : ''}
                    ${anime.type ? `<span class="absolute top-2 right-2 bg-black/60 backdrop-blur text-white text-[10px] font-bold px-2 py-0.5 rounded">${anime.type}</span>` : ''}
                  </div>
                  <div class="p-3">
                    <p class="text-sm font-bold truncate group-hover:text-[#e50914] transition">${anime.title || 'Untitled'}</p>
                    <div class="flex items-center gap-2 mt-1.5">
                      ${anime.genre ? `<span class="text-[11px] text-white/40 truncate"><i class="fa-solid fa-layer-group mr-1 text-[9px]"></i>${anime.genre}</span>` : ''}
                      ${anime.status ? `<span class="text-[11px] ml-auto font-bold ${anime.status.toLowerCase().includes('ongoing') ? 'text-[#e50914]' : 'text-emerald-400'}">${anime.status}</span>` : ''}
                    </div>
                  </div>`;
                grid.appendChild(card);
              });
              const next2 = data2.next_url || data2.more_url;
              if (next2) {
                this.disabled = false;
                this.innerHTML = `<span>Next</span> <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-0.5 transition"></i>`;
                this.onclick = arguments.callee;
                this.setAttribute('onclick', `loadNextPage('${next2.replace(/'/g, "\\'")}')`);
              } else {
                this.innerHTML = '<i class="fa-solid fa-check"></i> Habis';
                this.classList.add('opacity-50');
              }
            } else {
              this.innerHTML = '<i class="fa-solid fa-check"></i> Habis';
              this.classList.add('opacity-50');
            }
          } catch (e) {
            this.innerHTML = 'Error';
            this.disabled = false;
          }
        };
      }

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('sectionContent').classList.remove('hidden');
      document.getElementById('sectionGrid').classList.remove('hidden');
    } else {
      document.getElementById('loading').innerHTML = '<p class="text-white/40 font-bold">Tidak ada data.</p>';
    }
  } catch (e) {
    document.getElementById('loading').innerHTML = `<p class="text-red-400">Error: ${e.message}</p>`;
  }
}

async function loadNextPage(url) {
  const btn = document.getElementById('loadMoreBtn');
  const grid = document.getElementById('animeGrid');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memuat...';
  try {
    const res = await fetch(`/api/load-more?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (data.status === 'success' && data.data && data.data.length) {
      data.data.forEach(anime => {
        const detailUrl = anime.url ? `/detail?url=${encodeURIComponent(anime.url)}` : '#';
        const card = document.createElement('a');
        card.href = detailUrl;
        card.className = 'section-card';
        card.innerHTML = `
          <div class="relative aspect-[2/3] overflow-hidden bg-[#1a1a1a]">
            <img src="${anime.poster || ''}" alt="${anime.title || ''}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.style.display='none'"/>
            ${anime.episode ? `<span class="absolute top-2 left-2 bg-[#e50914] text-white text-[10px] font-black px-2 py-0.5 rounded">${anime.episode}</span>` : ''}
            ${anime.type ? `<span class="absolute top-2 right-2 bg-black/60 backdrop-blur text-white text-[10px] font-bold px-2 py-0.5 rounded">${anime.type}</span>` : ''}
          </div>
          <div class="p-3">
            <p class="text-sm font-bold truncate group-hover:text-[#e50914] transition">${anime.title || 'Untitled'}</p>
            <div class="flex items-center gap-2 mt-1.5">
              ${anime.genre ? `<span class="text-[11px] text-white/40 truncate"><i class="fa-solid fa-layer-group mr-1 text-[9px]"></i>${anime.genre}</span>` : ''}
              ${anime.status ? `<span class="text-[11px] ml-auto font-bold ${anime.status.toLowerCase().includes('ongoing') ? 'text-[#e50914]' : 'text-emerald-400'}">${anime.status}</span>` : ''}
            </div>
          </div>`;
        grid.appendChild(card);
      });
      const next = data.next_url || data.more_url;
      if (next) {
        btn.disabled = false;
        btn.innerHTML = `<span>Next</span> <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-0.5 transition"></i>`;
        btn.setAttribute('onclick', `loadNextPage('${next.replace(/'/g, "\\'")}')`);
      } else {
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Habis';
        btn.classList.add('opacity-50');
      }
    } else {
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Habis';
      btn.classList.add('opacity-50');
    }
  } catch (e) {
    btn.innerHTML = 'Error';
    btn.disabled = false;
  }
}

async function checkAuth() {
  try {
    const r = await fetch('/api/auth/me');
    const j = await r.json();
    if (j.logged_in) {
      document.getElementById('btnLogin')?.classList.add('hidden');
      document.getElementById('btnRegister')?.classList.add('hidden');
      const nav = document.getElementById('authNav');
      if (nav) { nav.classList.add('hidden'); nav.style.display = 'none'; }
      const um = document.getElementById('userMenu');
      if (um) { um.classList.remove('hidden'); um.classList.add('flex'); document.getElementById('navAvatar').src = j.user.avatar || 'https://i.pravatar.cc/100?u=' + encodeURIComponent(j.user.username); }
    }
  } catch (e) {}
}

document.addEventListener('DOMContentLoaded', () => { checkAuth(); loadSection(); });
window.addEventListener('click', e => { if (!e.target.closest('#userMenu')) { let d = document.getElementById('userDropdown'); if (d) d.classList.add('hidden'); } });
</script>
</body>
</html>
