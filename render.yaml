services:
  - type: web
    name: vexora
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && ./build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: NODE_VERSION
        value: 18
